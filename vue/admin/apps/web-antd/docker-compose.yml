version: '3.8'

services:
  vben-admin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vben-admin
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - vben-network
    volumes:
      # 如果需要持久化日志，可以添加volume
      - nginx-logs:/var/log/nginx
    environment:
      - TZ=Asia/Shanghai

volumes:
  nginx-logs:

networks:
  vben-network:
    driver: bridge
